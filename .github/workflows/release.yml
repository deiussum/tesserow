name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'flatpak/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Generate offline sources
        # The builder image points PYTHONPATH at its own site-packages; keep
        # it out of the generators' venv.
        env:
          PYTHONPATH: ''
        run: flatpak/build.sh generate
      - name: Read version
        id: version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.deiussum.tesserow.yml
          bundle: Tesserow_${{ steps.version.outputs.version }}_x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}
          artifact-name: flatpak
          # Keep flatpak-builder's dirs inside the tree the manifest's source skips.
          build-dir: flatpak/.build/build-dir
          repo-dir: flatpak/.build/repo
          state-dir: flatpak/.build/state

  linux:
    # An older base than ubuntu-latest: the .deb/AppImage link against the
    # build host's glibc, so this keeps them runnable on older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create a draft only if there's no release yet; never touch an
          # existing release's title, notes, or draft state.
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --notes ""
          find artifacts -type f \( -name '*.flatpak' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
